<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoteSpace — Ruang Catatanmu</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">📓</span>
          <span class="logo-text">NoteSpace</span>
        </div>
        <p class="tagline">Ruang untuk pikiran-pikiranmu</p>
      </div>
      <button class="btn-new" onclick="openModal()">
        <span>+</span> Catatan Baru
      </button>
    </header>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-num" id="totalNotes">0</span>
        <span class="stat-label">Total Catatan</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-num" id="todayNotes">0</span>
        <span class="stat-label">Hari Ini</span>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari catatan..." oninput="filterNotes()" />
    </div>

    <!-- NOTES GRID -->
    <div class="notes-grid" id="notesGrid">
      <!-- Notes loaded here -->
    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">🌿</div>
      <h3>Belum ada catatan</h3>
      <p>Mulai tulis sesuatu yang bermakna hari ini</p>
      <button class="btn-new" onclick="openModal()">Buat Catatan Pertama</button>
    </div>
  </div>

  <!-- MODAL TAMBAH/EDIT -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Catatan Baru</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="noteId" />
        <div class="form-group">
          <label>Judul</label>
          <input type="text" id="inputJudul" placeholder="Tulis judul catatan..." maxlength="100"/>
          <span class="char-count" id="judulCount">0/100</span>
        </div>
        <div class="form-group">
          <label>Isi Catatan</label>
          <textarea id="inputIsi" placeholder="Tuangkan pikiranmu di sini..." rows="6"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn-save" onclick="saveNote()">
          <span id="saveIcon">💾</span> Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast"></div>

  <!-- DELETE CONFIRM MODAL -->
  <div class="modal-overlay" id="deleteOverlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Hapus Catatan?</h2>
      </div>
      <div class="modal-body">
        <p>Catatan "<strong id="deleteNoteName"></strong>" akan dihapus permanen. Lanjutkan?</p>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeDeleteModal()">Batal</button>
        <button class="btn-delete-confirm" onclick="confirmDelete()">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
